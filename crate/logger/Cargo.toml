[package]
name = "cosmian_logger"
description = "Shared tracing and OTLP initialization for Rust services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "ansi",
    "env-filter",
    "fmt",
    "std"
] }

# opentelemetry-otlp pulls tonic -> tokio (net feature) -> mio, which does not
# compile for wasm32-unknown-unknown.  Gate the entire OTLP and syslog stacks.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", features = [
    "metrics",
    "logs",
    "grpc-tonic"
] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = [
    "metrics",
    "logs",
    "rt-tokio"
] }
syslog-tracing = "0.3"
tracing-appender = { workspace = true }
tracing-opentelemetry = { version = "0.33" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "tracing_example"
