[package]
name = "cosmian_http_client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP client with multi-authentication support"

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
default = []
session = ["dep:actix-identity", "dep:actix-session"]

[dependencies]
actix-identity = { version = "0.9", optional = true }
actix-session = { version = "0.11", optional = true }
actix-web = { version = "4.9", features = ["macros"] }
derive_more = { version = "2.1", features = ["deref", "deref_mut"] }
# Disable default features to avoid pulling in rustls
# The "reqwest" feature will still use our reqwest dependency (with native-tls only)
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
# For FIPS compliance: use only native-tls (OpenSSL), not rustls (AWS-LC)
# Removed "default" (includes rustls) and "rustls-tls" to avoid conflicts
# Need "blocking" for Identity::from_pem
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
  "socks",
  "http2",
  "macos-system-configuration",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.47", features = ["full"] }
# actix-web 4.x → actix-http 3.x → cookie 0.16.2 uses time::Parseable (1-arg)
# which was removed in time >= 0.3.36. Cap time here so fresh dep resolutions
# (e.g. cargo-semver-checks) don't pick up a breaking time version.
time = { version = ">=0.3, <0.3.36" }
tracing = "0.1"
url = "2.5"
x509-cert = "0.2.5"

[dev-dependencies]
actix-http = "3.6.0"
anyhow = "1.0.99"
cosmian_logger = { path = "../logger" }

# `time` above is not used directly in code — it is a version constraint to keep
# actix-web 4.x transitive dep cookie 0.16.2 compilable (cookie uses time::Parseable
# removed in time >= 0.3.36). cargo-machete must ignore it.
[package.metadata.cargo-machete]
ignored = ["time"]
